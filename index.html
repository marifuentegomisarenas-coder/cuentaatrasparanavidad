<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pollito, pollito</title>
<style>
:root{--bg:#b3131b;--card:#fffaf5;--tx:#3a1a1d;--ac:#c0392b;--hi:#ffd83a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#7d0d14;--card:#2a1618;--tx:#fbe9e6;--ac:#ff7b6b}}
:root[data-theme="dark"]{--bg:#7d0d14;--card:#2a1618;--tx:#fbe9e6;--ac:#ff7b6b}
*{box-sizing:border-box}html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:#fff;font-family:Georgia,'Times New Roman',serif;min-height:100vh}
[hidden]{display:none!important}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.snow span{position:absolute;top:-30px;color:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:24px 18px 40px;text-align:center}
h1{font-size:2rem;margin:0 0 6px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.q{font-size:1.2rem;margin:0 0 18px;opacity:.95}
.chick{width:210px;max-width:60%;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.form{display:flex;flex-direction:column;gap:10px;margin-top:10px}
input{width:100%;padding:14px;border-radius:14px;border:3px solid #fff;background:#fff;color:#3a1a1d;font-size:1.1rem;text-align:center;font-family:system-ui,sans-serif}
button.main{padding:14px;border:0;border-radius:14px;background:var(--hi);color:#7a0c12;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:system-ui,sans-serif}
button.ghost{margin-top:14px;background:none;border:2px solid #fff;color:#fff;border-radius:14px;padding:10px 16px;cursor:pointer;font-family:system-ui,sans-serif}
.msg{min-height:1.4em;margin-top:8px;font-family:system-ui,sans-serif;font-size:.95rem}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.egg{position:relative;aspect-ratio:3/4;border:4px solid #fff;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;overflow:hidden;padding:0;background:#ffe9a8;cursor:pointer}
.egg img{width:100%;height:100%;object-fit:cover;display:block}
.egg .e{display:flex;align-items:center;justify-content:center;height:100%;font-size:2rem}.egg.lock{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);cursor:default}.egg.lock .e{opacity:.75}.egg.lock i{background:rgba(0,0,0,.28)}
.egg i{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);background:#b3131b;color:#fff;font-style:normal;padding:2px 12px;border-radius:99px;font-family:system-ui,sans-serif;font-weight:700}
.egg em{position:absolute;top:10%;left:50%;transform:translateX(-50%);background:var(--hi);color:#7a0c12;font-style:normal;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;font-family:system-ui,sans-serif;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.12)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.on{display:flex}
.box{background:var(--card);color:var(--tx);border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.box h2{margin:0 0 10px}.box p{line-height:1.5;font-size:1.05rem}
.photo{width:100%;border-radius:14px;display:block}
.ph2{height:220px;border-radius:14px;background:linear-gradient(135deg,#ffb4a8,#ffd9a8);display:flex;align-items:center;justify-content:center;font-size:3rem}
button.x{background:none;border:0;color:var(--ac);cursor:pointer;font-size:1rem;margin-top:6px}
.stage{display:grid;place-items:center;height:270px;margin:22px 0 8px}.stage>*{grid-area:1/1}
.shell{position:relative;width:190px;height:253px}
.half{position:absolute;inset:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:linear-gradient(#fff3d6 0 35%,#d62828 35% 42%,#fff3d6 42% 62%,#2e8b57 62% 69%,#fff3d6 69%);box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.half.top{clip-path:polygon(0 0,100% 0,100% 48%,85% 55%,70% 46%,55% 56%,40% 46%,25% 55%,10% 47%,0 54%)}
.half.bot{clip-path:polygon(0 54%,10% 47%,25% 55%,40% 46%,55% 56%,70% 46%,85% 55%,100% 48%,100% 100%,0 100%)}
.crack{position:absolute;left:0;top:44%;width:100%;height:14%;opacity:0;transition:opacity .3s}
.shell.cracking .crack{opacity:1}
.shell.wob{animation:wob .45s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.shell.split .top{animation:tp .8s ease-in forwards}.shell.split .bot{animation:bt .8s ease-in forwards}
@keyframes tp{to{transform:translate(-40px,-70px) rotate(-30deg);opacity:0}}
@keyframes bt{to{transform:translate(40px,40px) rotate(20deg);opacity:0}}
.egg.big{width:190px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.hint{margin:6px 0 14px}
@media (prefers-reduced-motion:reduce){.snow span,.chick,.egg em,.shell.wob,.egg.big{animation:none}}
</style></head><body>

<h1>¡Pollito, pollito!</h1>
<p class="q">¿Has adivinado la palabra de hoy?</p>
<div class="form" id="form"><input id="w" placeholder="Escribe la clave…" autocomplete="off" autocapitalize="off"><button class="main" id="go">Comprobar 🥚</button></div>
<div class="msg" id="m"></div>
<button class="ghost" id="see" hidden></button>
</main>
<main class="wrap" id="eggs" hidden>
<h1>Tus huevos sorpresa 🥚</h1><p class="q" id="cnt"></p>
<div class="grid" id="grid"></div>
<button class="ghost" id="back">← Escribir otra clave</button>
</main>
<main class="wrap" id="hatch" hidden>
<p class="q" id="hmsg"></p>
<div class="stage"><div class="shell" id="shell"><div class="half top"></div><div class="half bot"></div><svg class="crack" viewBox="0 0 100 20" preserveAspectRatio="none"><polyline points="0,12 10,4 25,13 40,3 55,14 70,3 85,12 100,5" fill="none" stroke="#7a0c12" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg></div><button class="egg big" id="born" hidden></button></div>
<p class="q hint" id="hint" hidden>Toca tu huevo de hoy 👆</p>
<button class="main" id="all" style="width:100%" hidden>Ver toda la colección</button>
</main>

const TEST=location.hash==='#prueba';
const $=id=>document.getElementById(id);
let saved={};try{saved=JSON.parse(localStorage.getItem('adv')||'{}')}catch(e){}
function save(){try{localStorage.setItem('adv',JSON.stringify(saved))}catch(e){}}
function norm(s){return s.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const count=()=>DAYS.filter(x=>saved[x.d]).length;
function show(v){['home','hatch','eggs'].forEach(k=>$(k).hidden=k!==v);window.scrollTo(0,0)}
function drawHome(){const n=count();$('see').hidden=false;$('see').textContent='Ver mis huevos ('+(TEST?24:n)+')'}
function drawEggs(newId){const g=$('grid');g.innerHTML='';const n=DAYS.filter(x=>TEST||saved[x.d]).length;
$('cnt').textContent=n?'Has conseguido '+n+' de 24':'Todavía no tienes ninguno';
DAYS.forEach(x=>{const ok=TEST||saved[x.d];const b=document.createElement('button');b.className='egg'+(ok?'':' lock');
b.innerHTML=ok?(x.img?'<img src="'+x.img+'" alt="">':'<div class="e">🥚</div>')+'<i>'+x.d+'</i>'+(x.d===newId?'<em>¡Nuevo!</em>':''):'<div class="e">🔒</div><i>'+x.d+'</i>';
if(ok)b.onclick=()=>openDay(x);g.appendChild(b)})}
function closeM(){$('modal').classList.remove('on')}
function openDay(x){$('box').innerHTML='<h2>Día '+x.d+' 💛</h2>'+(x.img?'<img class="photo" src="'+x.img+'" alt="">':'<div class="ph2">📸</div>')+'<p>'+(x.t||'')+'</p><button class="x" id="c">Cerrar</button>';$('modal').classList.add('on');$('c').onclick=closeM}
function hatch(x){show('hatch');const sh=$('shell'),bn=$('born');
sh.hidden=false;sh.className='shell wob';bn.hidden=true;$('hint').hidden=true;$('all').hidden=true;
$('hmsg').textContent='¡Algo se mueve ahí dentro… 🥚';
bn.innerHTML=(x.img?'<img src="'+x.img+'" alt="">':'<div class="e">🥚</div>')+'<i>'+x.d+'</i>';
bn.onclick=()=>openDay(x);
setTimeout(()=>{sh.classList.add('cracking');$('hmsg').textContent='¡Cuidado, está a punto de salir! 🐣'},1400);
setTimeout(()=>{sh.classList.remove('wob');sh.classList.add('split')},2800);
setTimeout(()=>{sh.hidden=true;bn.hidden=false;$('hmsg').textContent='¡Ha eclosionado! 🐥';$('hint').hidden=false;$('all').hidden=false},3500)}
async function tryWord(){const w=$('w'),m=$('m'),v=norm(w.value);if(!v)return;
let hs='';try{hs=await sha(v)}catch(e){}
const x=DAYS.find(d=>d.h&&d.h===hs);
if(!x){m.textContent='Mmm, esa no es… ¡prueba otra vez! 🐣';w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');return}
m.textContent='';w.value='';saved[x.d]=1;save();drawHome();hatch(x)}
$('go').onclick=tryWord;$('w').onkeydown=e=>{if(e.key==='Enter')tryWord()};
